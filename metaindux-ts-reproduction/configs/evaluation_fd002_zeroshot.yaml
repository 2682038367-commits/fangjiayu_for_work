experiment:
  dataset: FD002
  window_size: 48
  generation_seeds: [3, 13, 23, 33, 43]
  evaluator_seeds: [3, 13, 23, 33, 43]
  fixed_split_seed: 20260915
  synthetic_pattern: outputs/FD002_w48_seed{generation_seed}_zeroshot_paper.npz

evaluation:
  evaluator_epochs: 35
  predictor_layers: 2
  test_label_max: 30
  device: cuda
  deterministic_torch: true
  resume: true
  predictive_train_rate: 0.7
  discriminator_train_rate: 0.8

outputs:
  raw_csv: results/zeroshot/fd002_table_v_evaluation_raw.csv
  summary_csv: results/zeroshot/fd002_table_v_evaluation_summary.csv
  split_indices: results/zeroshot/fd002_table_v_eval_split.npz
  manifest: results/zeroshot/fd002_table_v_evaluation_manifest.json
  evaluator_checkpoints: checkpoints/evaluators/fd002_table_v_zeroshot
