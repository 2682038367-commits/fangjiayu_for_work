experiment:
  name: metaindux_ts_fd002_soft_learnable_threshold_remaining_seeds
  artifact_tag: soft_theta025_tau01
  datasets: [FD002]
  window_sizes: [48]
  # Seed 43 is already complete. These are the other six generation seeds.
  seeds: [3, 13, 23, 33, 53, 63]

model:
  name: DiffUnet_fre
  input_size: 14
  frequency_mask_mode: soft_learnable_energy
  frequency_threshold_init: 0.25
  frequency_mask_temperature: 0.1

diffusion:
  timesteps: 1000
  beta_schedule: linear
  sample_type: ddpm

training:
  epochs: 70
  optimizer: adam
  learning_rate: 0.002
  lr_schedule: warmup_cosine
  batch_size: 256
  grad_clip: 1.0

runtime:
  state: all
  device: cuda
  wandb_mode: offline
