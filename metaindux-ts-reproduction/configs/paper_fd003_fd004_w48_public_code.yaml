experiment:
  name: metaindux_ts_fd003_fd004_w48_public_code
  datasets: [FD003, FD004]
  window_sizes: [48]
  seeds: [3, 13, 23, 33, 43]

model:
  name: DiffUnet_fre
  input_size: 14
  frequency_mask_mode: hard_random_quantile

diffusion:
  timesteps: 1000
  beta_schedule: linear
  sample_type: ddpm

training:
  epochs: 70
  optimizer: adam
  learning_rate: 0.002
  lr_schedule: warmup_cosine
  batch_size: 256
  grad_clip: 1.0

runtime:
  # Upstream train state performs both training and full DDPM sampling.
  # Formal evaluation below replaces its built-in single evaluator/Context-FID.
  state: train
  device: cuda
  wandb_mode: offline
