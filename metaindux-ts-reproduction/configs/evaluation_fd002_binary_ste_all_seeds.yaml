experiment:
  dataset: FD002
  window_size: 48
  generation_seeds: [3, 13, 23, 33, 43, 53, 63]
  evaluator_seeds: [3, 13, 23, 33, 43]
  fixed_split_seed: 20260915
  synthetic_pattern: outputs/FD002_w48_seed{generation_seed}_binary_ste_theta1_tau01.npz

evaluation:
  evaluator_epochs: 35
  device: cuda
  deterministic_torch: true
  resume: true
  predictive_train_rate: 0.7
  discriminator_train_rate: 0.8

outputs:
  raw_csv: results/binary_ste/fd002_evaluation_raw.csv
  summary_csv: results/binary_ste/fd002_evaluation_summary.csv
  split_indices: results/binary_ste/fd002_split.npz
  manifest: results/binary_ste/fd002_manifest.json
  evaluator_checkpoints: checkpoints/evaluators/fd002_binary_ste
