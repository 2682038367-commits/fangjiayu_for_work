# 评估配置草案 —— FD002 固定 θ=0.25 臂，全 7 个生成种子
#
# 状态：rmse_random 来源已确认（脚本 164 行硬编码公开臂 outputs/FD002_w48_seed{seed}.npz，
#       自动两遍评估并写配对），唯一剩余待确认项是 sample_count 是否随 generation_seeds 变化。
#       跑完后比对 manifest 的 split_sha256 是否仍为 8c390ebf... 即可判定。
# 与原版差异：
#   1) generation_seeds 3→7（新增 3, 33, 53, 63），13/23/43 作为确定性自检重跑
#   2) 所有输出路径换新，不覆盖原 3 种子存档（原 manifest status=complete）
#   3) evaluator_checkpoints 独立目录，避免与原 15 次评估的产物互相 resume
#
# 前置条件：outputs/FD002_w48_seed{3,13,23,33,43,53,63}_freq_threshold_025.npz 全部存在

experiment:
  dataset: FD002
  window_size: 48
  generation_seeds: [3, 13, 23, 33, 43, 53, 63]
  evaluator_seeds: [3, 13, 23, 33, 43]
  fixed_split_seed: 20260915
  synthetic_pattern: outputs/FD002_w48_seed{generation_seed}_freq_threshold_025.npz

evaluation:
  evaluator_epochs: 35
  device: cuda
  deterministic_torch: true
  resume: false
  predictive_train_rate: 0.7
  discriminator_train_rate: 0.8

outputs:
  raw_csv: results/frequency_threshold_validation/fd002_fixed_025_seven_seeds_evaluation_raw.csv
  summary_csv: results/frequency_threshold_validation/fd002_fixed_025_seven_seeds_evaluation_summary.csv
  split_indices: results/frequency_threshold_validation/fd002_fixed_025_seven_seeds_split.npz
  manifest: results/frequency_threshold_validation/fd002_fixed_025_seven_seeds_manifest.json
  evaluator_checkpoints: checkpoints/evaluators/fd002_freq_threshold_025_seven_seeds
