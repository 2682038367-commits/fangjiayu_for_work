experiment:
  dataset: FD002
  window_size: 48
  generation_seeds: [13, 23, 43]
  evaluator_seeds: [3, 13, 23, 33, 43]
  fixed_split_seed: 20260915
  synthetic_pattern: outputs/FD002_w48_seed{generation_seed}_lr_constant.npz

evaluation:
  evaluator_epochs: 35
  device: cuda
  deterministic_torch: true
  resume: false
  predictive_train_rate: 0.7
  discriminator_train_rate: 0.8

outputs:
  raw_csv: results/lr_validation/fd002_constant_lr_evaluation_raw.csv
  summary_csv: results/lr_validation/fd002_constant_lr_evaluation_summary.csv
  split_indices: results/lr_validation/fd002_constant_lr_fixed_split.npz
  manifest: results/lr_validation/fd002_constant_lr_manifest.json
  evaluator_checkpoints: checkpoints/evaluators/fd002_lr_constant
