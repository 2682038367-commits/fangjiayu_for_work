experiment:
  dataset: FD002
  window_size: 48
  generation_seeds: [43]
  evaluator_seeds: [3, 13, 23, 33, 43]
  fixed_split_seed: 20260915
  synthetic_pattern: outputs/FD002_w48_seed{generation_seed}_soft_theta025_tau01.npz

evaluation:
  evaluator_epochs: 35
  device: cuda
  deterministic_torch: true
  resume: false
  predictive_train_rate: 0.7
  discriminator_train_rate: 0.8

outputs:
  raw_csv: results/soft_learnable_threshold/fd002_seed43_evaluation_raw.csv
  summary_csv: results/soft_learnable_threshold/fd002_seed43_evaluation_summary.csv
  split_indices: results/soft_learnable_threshold/fd002_seed43_split.npz
  manifest: results/soft_learnable_threshold/fd002_seed43_manifest.json
  evaluator_checkpoints: checkpoints/evaluators/fd002_soft_threshold_seed43
