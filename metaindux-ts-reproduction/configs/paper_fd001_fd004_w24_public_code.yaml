# Formal public-code mainline for C-MAPSS FD001-FD004, sequence length 24.
experiment:
  name: metaindux_ts_fd001_fd004_w24_public_code
  datasets: [FD001, FD002, FD003, FD004]
  window_sizes: [24]
  generation_seeds: [3, 13, 23, 33, 43]
  seeds: [3, 13, 23, 33, 43]

model:
  name: DiffUnet_fre
  input_size: 14
  frequency_mask_mode: hard_random_quantile

diffusion:
  timesteps: 1000
  beta_schedule: linear
  sample_type: ddpm

training:
  epochs: 70
  optimizer: adam
  learning_rate: 0.002
  lr_schedule: warmup_cosine
  batch_size: 256
  grad_clip: 1.0

runtime:
  # Upstream train state includes training and full DDPM sampling. Formal
  # fixed-split evaluation is deliberately run by a separate evaluator.
  state: train
  device: cuda
  wandb_mode: offline
