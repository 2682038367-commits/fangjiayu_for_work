experiment:
  dataset: FD002
  window_size: 48
  generation_seeds: [3, 13, 23, 33, 43, 53, 63]
  evaluator_seeds: [3, 13, 23, 33, 43]
  fixed_split_seed: 20260915
  synthetic_pattern: outputs/FD002_w48_seed{generation_seed}.npz

evaluation:
  evaluator_epochs: 35
  device: cuda
  deterministic_torch: true
  resume: false
  predictive_train_rate: 0.7
  discriminator_train_rate: 0.8

outputs:
  raw_csv: results/frequency_threshold_validation/fd002_public_arm_seven_seeds_evaluation_raw.csv
  summary_csv: results/frequency_threshold_validation/fd002_public_arm_seven_seeds_evaluation_summary.csv
  split_indices: results/frequency_threshold_validation/fd002_public_arm_seven_seeds_split.npz
  manifest: results/frequency_threshold_validation/fd002_public_arm_seven_seeds_manifest.json
  evaluator_checkpoints: checkpoints/evaluators/fd002_public_arm_seven_seeds
