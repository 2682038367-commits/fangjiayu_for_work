experiment:
  name: metaindux_ts_full_paper
  datasets: [FD001, FD002, FD003, FD004]
  window_sizes: [24, 48, 96]
  seeds: [3, 13, 23, 33, 43]

model:
  name: DiffUnet_fre
  input_size: 14

diffusion:
  timesteps: 1000
  beta_schedule: linear
  sample_type: ddpm

training:
  epochs: 70
  optimizer: adam
  learning_rate: 0.002
  batch_size: 256
  grad_clip: 1.0

runtime:
  state: all
  device: cuda
  wandb_mode: offline
