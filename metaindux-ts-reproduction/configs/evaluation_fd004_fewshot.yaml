experiment:
  dataset: FD004
  window_size: 48
  generation_seeds: [3, 13, 23, 33, 43]
  evaluator_seeds: [3, 13, 23, 33, 43]
  fixed_split_seed: 20260915
  synthetic_pattern: outputs/FD004_w48_seed{generation_seed}_fewshot10_paper.npz

evaluation:
  evaluator_epochs: 35
  predictor_layers: 2
  test_label_max: 30
  device: cuda
  deterministic_torch: true
  resume: true
  predictive_train_rate: 0.7
  discriminator_train_rate: 0.8

outputs:
  raw_csv: results/fewshot/fd004_table_vi_evaluation_raw.csv
  summary_csv: results/fewshot/fd004_table_vi_evaluation_summary.csv
  split_indices: results/fewshot/fd004_table_vi_eval_split.npz
  manifest: results/fewshot/fd004_table_vi_evaluation_manifest.json
  evaluator_checkpoints: checkpoints/evaluators/fd004_table_vi_fewshot
