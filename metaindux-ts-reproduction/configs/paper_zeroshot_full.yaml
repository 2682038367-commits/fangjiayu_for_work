# Table V zero-shot arm; same controlled settings as Table VI.
experiment:
  name: metaindux_ts_table_v_full_zeroshot
  datasets:
  - FD001
  - FD002
  - FD003
  - FD004
  window_sizes:
  - 48
  generation_seeds:
  - 3
  - 13
  - 23
  - 33
  - 43
  seeds:
  - 3
  - 13
  - 23
  - 33
  - 43
  task: zeroshot
  fatigue_threshold: 30
  artifact_tag: zeroshot_paper
model:
  name: DiffUnet_fre
  input_size: 14
  frequency_mask_mode: hard_random_quantile
diffusion:
  timesteps: 1000
  beta_schedule: linear
  sample_type: ddpm
training:
  epochs: 70
  optimizer: adam
  learning_rate: 0.002
  lr_schedule: warmup_cosine
  batch_size: 64
  grad_clip: 1.0
runtime:
  state: train
  device: cuda
  wandb_mode: offline
