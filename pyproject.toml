[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronos2-rul-reproduction"
version = "0.1.0"
description = "Reproduction of the Wide & Deep Chronos-2 adapter for C-MAPSS RUL prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "chronos-forecasting>=2.1,<3",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.3,<2",
  "torch>=2.2,<3",
  "transformers>=4.41,<5",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
chronos-rul = "rul_chronos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
