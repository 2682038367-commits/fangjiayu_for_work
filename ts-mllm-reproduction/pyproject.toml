[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ts-mllm-reproduction"
version = "0.1.0"
description = "Unofficial reproduction of TS-MLLM for C-MAPSS RUL prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
qwen = ["transformers>=4.57,<5"]
conditions = ["scikit-learn>=1.7,<2"]

[project.scripts]
ts-mllm-temporal = "ts_mllm.training:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
